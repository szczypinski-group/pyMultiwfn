[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyMultiwfn"
version = "0.1.0"
description = "Python interface and automation toolkit for Multiwfn"
authors = [
    { name="Pierre-Louis Valero", email="ypkh17@durham.ac.uk" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
